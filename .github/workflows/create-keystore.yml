name: Create Alexa Signing Key

on:
  workflow_dispatch:

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Generate signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ALEXA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ALEXA_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          keytool -genkeypair \
            -keystore alexa-release.jks \
            -alias alexa \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Alexa Voice Assistant, OU=Personal, O=Alexa Project, L=Unknown, ST=Unknown, C=IN"

      - name: Upload signing key backup
        uses: actions/upload-artifact@v4
        with:
          name: alexa-signing-key-backup
          path: alexa-release.jks
          retention-days: 1
